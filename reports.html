<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">


<title>Reports</title>


<link rel="stylesheet"
href="css/reports.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


</head>


<body>



<!-- Sidebar -->


<div class="sidebar">


<h2>

<i class="fa-solid fa-wallet"></i>

Expense Tracker

</h2>



<ul>


<li onclick="location.href='dashboard.html'">

<i class="fa-solid fa-house"></i>

Dashboard

</li>



<li onclick="location.href='category.html'">

<i class="fa-solid fa-list"></i>

Categories

</li>




<li onclick="location.href='transaction.html'">

<i class="fa-solid fa-money-bill"></i>

Transactions

</li>




<li class="active">

<i class="fa-solid fa-chart-column"></i>

Reports

</li>




<li onclick="logout()">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</li>


</ul>


</div>






<!-- Main -->


<div class="main">



<div class="top">


<h1>

Reports

</h1>



<button onclick="downloadReport()">

<i class="fa-solid fa-download"></i>

Download

</button>


</div>








<!-- Filters -->


<div class="filters">


<select id="reportType"
onchange="changeReport()">



<option value="monthly">

Monthly Report

</option>



<option value="yearly">

Yearly Report

</option>



<option value="category">

Category Wise

</option>


</select>




<input

type="month"

id="month"

>



<button onclick="loadReport()">


Generate Report


</button>



</div>










<!-- Cards -->


<div class="cards">



<div class="card">


<h3>

Total Income

</h3>


<h1 id="income">

₹0

</h1>


</div>






<div class="card">


<h3>

Total Expense

</h3>


<h1 id="expense">

₹0

</h1>


</div>






<div class="card">


<h3>

Balance

</h3>


<h1 id="balance">

₹0

</h1>


</div>


</div>









<!-- Charts -->


<div class="charts">



<div class="chart-box">


<h2>

Category Spending

</h2>


<canvas id="categoryChart">

</canvas>


</div>






<div class="chart-box">


<h2>

Income vs Expense

</h2>


<canvas id="incomeChart">

</canvas>


</div>


</div>









<!-- Table -->


<div class="table-box">


<h2>

Report Summary

</h2>



<table>


<thead>





<tr id="tableHeader">

<th>
Title
</th>


<th>
Amount
</th>


<th>
Type
</th>


<th>
Date
</th>


</tr>




</thead>




<tbody id="reportTable">


</tbody>



</table>


</div>




</div>







<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<script src="js/api.js"></script>

<script src="js/reports.js"></script>




</body>


</html>
