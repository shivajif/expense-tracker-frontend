<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker - Profile</title>

    <link rel="stylesheet"
          href="css/profile.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<!-- ===========================
Overlay
=========================== -->

<div class="overlay"
     id="overlay"
     onclick="toggleSidebar()">
</div>

<!-- ===========================
Sidebar
=========================== -->

<div class="sidebar"
     id="sidebar">

    <h2>

        <i class="fa-solid fa-wallet"></i>

        <span class="logo-text">

            Expense Tracker

        </span>

    </h2>

    <ul>

        <!-- Dashboard -->

        <li
            onclick="location.href='dashboard.html'">

            <i class="fa-solid fa-house"></i>

            <span>

                Dashboard

            </span>

        </li>

        <!-- Profile -->

        <li class="active">

            <i class="fa-solid fa-user"></i>

            <span>

                Profile

            </span>

        </li>

        <!-- Categories -->

        <li
            onclick="location.href='category.html'">

            <i class="fa-solid fa-layer-group"></i>

            <span>

                Categories

            </span>

        </li>

        <!-- Transactions -->

        <li
            onclick="location.href='transaction.html'">

            <i class="fa-solid fa-money-bill-transfer"></i>

            <span>

                Transactions

            </span>

        </li>

        <!-- Reports -->

        <li
            onclick="location.href='reports.html'">

            <i class="fa-solid fa-chart-column"></i>

            <span>

                Reports

            </span>

        </li>

        <!-- Logout -->

        <li
            onclick="logout()">

            <i class="fa-solid fa-right-from-bracket"></i>

            <span>

                Logout

            </span>

        </li>

    </ul>

</div>

<!-- ===========================
Main
=========================== -->

<div class="main">

    <!-- =======================
    Topbar
    ======================= -->

    <div class="topbar">

        <div class="top-left">

            <i class="fa-solid fa-bars menu-btn"
               onclick="toggleSidebar()"></i>

            <h1>

                My Profile

            </h1>

        </div>

        <h3 id="welcomeText">

            Welcome 👋

        </h3>

    </div>

    <!-- =======================
    Profile Section
    ======================= -->

    <div class="profile-container">

        <!-- Left Card -->

        <div class="profile-card">

            <div class="profile-image">

                <i class="fa-solid fa-circle-user"></i>

            </div>

            <h2 id="profileName">

                Loading...

            </h2>

            <p id="profileEmail">

                Loading...

            </p>

        </div>

        <!-- Right Card -->

        <div class="profile-form">

            <h2>

                Edit Profile

            </h2>

            <div class="form-group">

                <label>

                    Full Name

                </label>

                <input
                        type="text"
                        id="name"
                        placeholder="Enter Full Name">

            </div>

            <div class="form-group">

                <label>

                    Email

                </label>

                <input
                        type="email"
                        id="email"
                        readonly>

            </div>

            <button
                    class="btn"
                    onclick="updateProfile()">

                <i class="fa-solid fa-floppy-disk"></i>

                Update Profile

            </button>

        </div>

    </div>

    <!-- =======================
    Password Section
    ======================= -->

    <div class="password-card">

        <h2>

            Change Password

        </h2>

        <div class="form-group">

            <label>

                New Password

            </label>

            <input
                    type="password"
                    id="password"
                    placeholder="Enter New Password">

        </div>

        <button
                class="btn"
                onclick="updatePassword()">

            <i class="fa-solid fa-key"></i>

            Update Password

        </button>

    </div>

</div>

<!-- ===========================
JavaScript
=========================== -->

<script src="js/api.js"></script>

<script src="js/profile.js"></script>

</body>

</html>
